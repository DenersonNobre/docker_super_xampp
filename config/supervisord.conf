[supervisord]
nodaemon=true

[program:apache2]
command=/usr/sbin/apachectl -D FOREGROUND
autostart=true
autorestart=true

[program:mysql]
command=/usr/bin/mysqld_safe --bind-address=127.0.0.1
autostart=true
autorestart=true

[program:tomcat]
command=/opt/tomcat/bin/catalina.sh run
autostart=true
autorestart=true